#
# Build a standalone archive of one project release.  The result is an
# artifact; deploy.yml publishes it.  See doc/build.md, "Release archives".

name: archive

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Project name from projects.toml"
        required: true
        type: choice
        options: [joulescope_driver, pyjoulescope, jls]
      tag:
        description: "Release tag, for example v2.5.4"
        required: true

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Fetch project tags
        run: git -C external/${{ inputs.project }} fetch --tags origin
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install
        env:
          PROJECT: ${{ inputs.project }}
          TAG: ${{ inputs.tag }}
        run: |
          python -m pip install -r requirements.txt
          python -m joulescope_docs doxygen-install
          # autodoc documents the released package, matching the tag.
          python - <<'EOF'
          import os, subprocess, sys, tomllib
          p = tomllib.load(open('projects.toml', 'rb'))[os.environ['PROJECT']]
          version = os.environ['TAG'].removeprefix('v')
          subprocess.run([sys.executable, '-m', 'pip', 'install',
                          f"{p['package']}=={version}"], check=True)
          EOF
      - name: Build
        run: python -m joulescope_docs archive "${{ inputs.project }}" "${{ inputs.tag }}"
      - uses: actions/upload-artifact@v7
        with:
          name: archive-${{ inputs.project }}-${{ inputs.tag }}
          path: build/archive/
