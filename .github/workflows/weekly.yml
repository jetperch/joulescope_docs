#
# Checks that depend on the outside world or take longer: external links
# (report only) and build reproducibility.

name: weekly

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linkcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev libudev-dev
      - run: |
          python -m pip install --require-hashes -r requirements.txt
          python -m joulescope_docs deps
          python -m joulescope_docs doxygen-install
          python -m joulescope_docs html
      - name: Check external links (report only)
        run: python -m joulescope_docs linkcheck || true
      - uses: actions/upload-artifact@v4
        with:
          name: linkcheck
          path: build/linkcheck/output.txt

  reproducible:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev libudev-dev
      - run: |
          python -m pip install --require-hashes -r requirements.txt
          python -m joulescope_docs deps
          python -m joulescope_docs doxygen-install
      - name: Build twice and compare
        run: |
          python -m joulescope_docs html
          mv build/site build/site1
          python -m joulescope_docs html
          diff -r build/site1 build/site
