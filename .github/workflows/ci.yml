#
# Build and test the documentation on every push and pull request.  A green
# push to main deploys to S3 + CloudFront.  Setup: doc/deploy.md.
# The software projects are git submodules under external/.

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"

jobs:
  html:
    runs-on: ubuntu-24.04
    timeout-minutes: 20  # a stalled apt mirror otherwise hangs for hours
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0  # SOURCE_DATE_EPOCH comes from the last commit
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install system packages
        run: |
          sudo rm -f /var/lib/man-db/auto-update  # skip the slow man page reindex
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libusb-1.0-0-dev libudev-dev
      - name: Install Python packages
        run: |
          python -m pip install -r requirements.txt
          python -m joulescope_docs deps
          python -m joulescope_docs doxygen-install
      - name: Build HTML (warnings are errors)
        run: python -m joulescope_docs html
      - name: Test
        run: python -m pytest
      - name: Build release archives (archives.toml)
        # Last: it installs older package releases.
        run: python -m joulescope_docs archive --all
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: build/site/

  pdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install system packages
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libusb-1.0-0-dev libudev-dev \
              texlive-xetex texlive-latex-recommended texlive-latex-extra \
              texlive-fonts-recommended tex-gyre fonts-freefont-otf fonts-dejavu \
              fonts-noto-cjk latexmk librsvg2-bin
      - name: Install Python packages
        run: |
          python -m pip install -r requirements.txt
          python -m joulescope_docs deps
          python -m joulescope_docs doxygen-install
      - name: Build PDFs
        run: python -m joulescope_docs pdf
      - uses: actions/upload-artifact@v7
        with:
          name: pdf
          path: build/site/pdf/

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [html, pdf]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production  # the AWS role trusts only this environment
    concurrency: deploy      # one at a time; a newer push replaces a waiting one
    permissions:
      contents: read
      id-token: write        # OIDC
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: site
      - uses: actions/download-artifact@v8
        with:
          name: pdf
          path: site/pdf
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Sync to S3
        # Short browser cache: pages change with every deploy.  The CLI may
        # guess .yaml as binary, so the datasheets get an explicit text type.
        run: |
          aws s3 sync site/ "s3://${{ vars.DOCS_BUCKET }}/" --delete \
              --cache-control "public, max-age=300"
          aws s3 cp site/products/datasheets/ \
              "s3://${{ vars.DOCS_BUCKET }}/products/datasheets/" --recursive \
              --exclude "*" --include "*.yaml" \
              --content-type "text/yaml; charset=utf-8" \
              --cache-control "public, max-age=300" --metadata-directive REPLACE
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
              --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
