#
# Build and test the documentation on every push and pull request.  A green
# push to main deploys to S3 + CloudFront.  Setup: doc/deploy.md.
# The software projects are git submodules under external/.

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"

jobs:
  html:
    runs-on: ubuntu-24.04
    timeout-minutes: 20  # a stalled apt mirror otherwise hangs for hours
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0  # SOURCE_DATE_EPOCH comes from the last commit
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install system packages
        run: |
          sudo rm -f /var/lib/man-db/auto-update  # skip the slow man page reindex
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libusb-1.0-0-dev libudev-dev
      - name: Install Python packages
        run: |
          python -m pip install -r requirements.txt
          python -m joulescope_docs deps
          python -m joulescope_docs doxygen-install
      - name: Build HTML (warnings are errors)
        run: python -m joulescope_docs html
      - name: Test
        run: python -m pytest
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: build/site/

  pdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install system packages
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libusb-1.0-0-dev libudev-dev \
              texlive-xetex texlive-latex-recommended texlive-latex-extra \
              texlive-fonts-recommended tex-gyre fonts-freefont-otf fonts-dejavu \
              fonts-noto-cjk latexmk librsvg2-bin
      - name: Install Python packages
        run: |
          python -m pip install -r requirements.txt
          python -m joulescope_docs deps
          python -m joulescope_docs doxygen-install
      - name: Build PDFs
        run: python -m joulescope_docs pdf
      - uses: actions/upload-artifact@v7
        with:
          name: pdf
          path: build/pdf/  # en/products/<model>/*.pdf, ...

  archive:
    # Release archives are built once and kept: build and upload only the
    # archives.toml entries missing from S3.  See doc/build.md.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    concurrency: archive
    permissions:
      contents: read
      id-token: write
    env:
      BUCKET: ${{ vars.DOCS_BUCKET }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Find missing archives
        id: missing
        # index.html is uploaded last, so it marks a complete archive.
        run: |
          missing=""
          while read -r project tag; do
            if ! aws s3api head-object --bucket "$BUCKET" \
                --key "en/archive/$project/$tag/index.html" > /dev/null 2>&1; then
              missing="$missing $project:$tag"
            fi
          done < <(python -m joulescope_docs archive-list)
          echo "Missing:${missing:- none}"
          echo "list=${missing# }" >> "$GITHUB_OUTPUT"
      - name: Install
        if: steps.missing.outputs.list != ''
        run: |
          python -m pip install -r requirements.txt
          python -m joulescope_docs doxygen-install
      - name: Build and upload
        if: steps.missing.outputs.list != ''
        env:
          LIST: ${{ steps.missing.outputs.list }}
        run: |
          for item in $LIST; do
            project="${item%%:*}"
            tag="${item#*:}"
            python -m joulescope_docs archive "$project" "$tag" --install
            dir="build/archive/$project/$tag"
            dst="s3://$BUCKET/en/archive/$project/$tag"
            aws s3 cp "$dir" "$dst/" --recursive --exclude index.html \
                --cache-control "public, max-age=86400"
            aws s3 cp "$dir/index.html" "$dst/index.html" \
                --cache-control "public, max-age=86400"
          done

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [html, pdf, archive]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production  # the AWS role trusts only this environment
    concurrency: deploy      # one at a time; a newer push replaces a waiting one
    permissions:
      contents: read
      id-token: write        # OIDC
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: site
      - uses: actions/download-artifact@v8
        with:
          name: pdf
          path: site
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Sync to S3
        # Short browser cache: pages change with every deploy.  The archive
        # job owns archive/ except the version lists.  The CLI may guess
        # .yaml and .md as binary, so they get explicit text types.
        run: |
          aws s3 sync site/ "s3://${{ vars.DOCS_BUCKET }}/" --delete \
              --exclude "en/archive/*" --include "en/archive/*/versions.json" \
              --cache-control "public, max-age=300"
          for t in "yaml:text/yaml" "md:text/markdown"; do
            aws s3 cp site/ "s3://${{ vars.DOCS_BUCKET }}/" --recursive \
                --exclude "*" --include "*.${t%%:*}" --exclude "en/archive/*" \
                --content-type "${t#*:}; charset=utf-8" \
                --cache-control "public, max-age=300" --metadata-directive REPLACE
          done
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
              --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
