#
# Joulescope JS320 specifications.  Format: doc/datasheet_format.md in
# https://github.com/jetperch/joulescope_docs.  Values are as published,
# with the unit given in the "unit" column or in the value itself.

schema: joulescope-datasheet/1
model: JS320
title: Joulescope JS320 Precision DC Energy Analyzer
revision: "1.3"

notes:
  inrush: Suitable for handling inrush currents when connecting capacitive loads.
  calibration_interval: >-
    Recommended to comply with industry-standard practices, but the
    Joulescope JS320 is designed not to need recalibration.
  sustained_3a: >-
    Max 3 A sustained.  See the recommended operating conditions for higher
    current durations.
  trim_offset: ±1.0 nA for ±5 °C over 24 hours with trim offset calibration.
  accuracy: >-
    Accuracy is specified as a percentage of measurement plus a fixed offset.
    Some instruments specify offset as a percentage of the full-scale range.
  guaranteed_current: >-
    The highest current that this range is guaranteed to measure without
    saturation.  Higher currents may saturate the range and potentially trip
    the soft fuse for that current range.
  voltage_accuracy: At V+ == I+.  See the CMRR specification for extended voltage.

sections:
  - id: absolute_maximum_ratings
    title: Absolute maximum ratings
    columns: {name: "", min: Min, max: Max, unit: Unit}
    rows:
      - {id: usb_voltage, name: USB voltage, min: -0.3, max: 6, unit: V}
      - id: port_voltage
        name: Max voltage applied between any port (Current +, Current -, Voltage +, Voltage -)
        min: -20
        max: 20
        unit: V
      - id: port_to_usb_ground
        name: >-
          Max voltage to USB ground from any port (Current +, Current -,
          Voltage +, Voltage -)
        min: -48
        max: 48
        unit: V
      - {id: current_burst, name: "Input current (powered, burst)", min: -10, max: 10, unit: A}
      - {id: current_sustained, name: "Input current (powered, sustained)", min: -3, max: 3, unit: A}
      - {id: current_unpowered, name: Input current (unpowered), min: N/A (off), max: N/A (off), unit: A}
      - {id: storage_temperature, name: Storage temperature, min: -40, max: 80, unit: °C}
      - {id: operating_temperature, name: Operating temperature, min: 0, max: 50, unit: °C}
      - {id: humidity, name: Relative humidity (non-condensing), min: 0, max: 95, unit: "%"}
      - {id: altitude, name: Altitude from sea level, min: -100, max: 2500, unit: m}
      - {id: gpi_voltage, name: Max voltage applied to GPI relative to USB ground, min: -10, max: 10, unit: V}

  - id: mechanical_instrument
    title: Mechanical, instrument only
    columns: {name: "", typ: Typical, unit: Unit}
    rows:
      - {id: weight, name: Weight, typ: 190, unit: grams}
      - {id: width, name: Width, typ: 99, unit: mm}
      - {id: length, name: Length (including binding posts and BNC connector), typ: 126, unit: mm}
      - {id: height, name: Height, typ: 28, unit: mm}

  - id: mechanical_kit
    title: Mechanical, complete product kit
    columns: {name: "", typ: Typical, unit: Unit}
    rows:
      - {id: weight, name: Weight, typ: 510, unit: grams}
      - {id: width, name: Width, typ: 190, unit: mm}
      - {id: length, name: Length, typ: 200, unit: mm}
      - {id: height, name: Height, typ: 60, unit: mm}

  - id: recommended_operating_conditions
    title: Recommended operating conditions
    columns: {name: "", condition: Test condition, min: Min, typ: Typical, max: Max, unit: Unit}
    rows:
      - {id: operating_temperature, name: Operating temperature, min: 10, max: 40, unit: °C}
      - {id: usb_voltage, name: USB supply voltage, min: 4.5, typ: 5.0, max: 5.5, unit: V}
      - {id: usb_current, name: USB supply current, max: 500, unit: mA}
      - {id: voltage_input, name: Voltage applied across Voltage + and Voltage -, min: -15, max: 15, unit: V}
      - id: current_input_voltage
        name: Voltage applied across Current + and Current -
        condition: Current range off
        min: -15
        max: 15
        unit: V
      - {id: current_continuous, name: Input current, condition: continuous, min: -3, max: 3, unit: A}
      - id: current_pulse_50ms
        name: Input current pulse
        condition: < 50 milliseconds, < 3A average
        min: {value: -10, notes: [inrush]}
        max: {value: 10, notes: [inrush]}
        unit: A
      - id: current_pulse_250ms
        name: Input current pulse
        condition: < 250 milliseconds, < 3A average
        min: {value: -5, notes: [inrush]}
        max: {value: 5, notes: [inrush]}
        unit: A

  - id: specification_conditions
    title: Specification conditions
    columns: {name: "", value: ""}
    rows:
      - {id: temperature, name: Temperature, value: 23 °C ± 10 °C}
      - {id: humidity, name: Humidity, value: "20% to 80% RH, non-condensing"}
      - id: calibration_interval
        name: Calibration interval
        value: {value: 1, unit: year, notes: [calibration_interval]}

  - id: current_ranges
    title: Current measurement specifications
    columns:
      range: Range
      accuracy: {label: Accuracy, notes: [accuracy]}
      impedance: Impedance
      guaranteed: {label: Guaranteed, notes: [guaranteed_current]}
    rows:
      - id: range_10a
        range: {value: 10, unit: A, notes: [sustained_3a]}
        accuracy: {gain_pct: 0.25, offset: {value: 500, unit: µA}}
        impedance: {value: 0.01, unit: Ω}
        guaranteed: {value: 10.4, unit: A, symmetric: true}
      - id: range_180ma
        range: {value: 180, unit: mA}
        accuracy: {gain_pct: 0.25, offset: {value: 50, unit: µA}}
        impedance: {value: 0.11, unit: Ω}
        guaranteed: {value: 188, unit: mA, symmetric: true}
      - id: range_18ma
        range: {value: 18, unit: mA}
        accuracy: {gain_pct: 0.25, offset: {value: 5, unit: µA}}
        impedance: {value: 1.11, unit: Ω}
        guaranteed: {value: 18.8, unit: mA, symmetric: true}
      - id: range_1800ua
        range: {value: 1.8, unit: mA}
        accuracy: {gain_pct: 0.25, offset: {value: 500, unit: nA}}
        impedance: {value: 11.1, unit: Ω}
        guaranteed: {value: 1.88, unit: mA, symmetric: true}
      - id: range_180ua
        range: {value: 180, unit: µA}
        accuracy: {gain_pct: 0.25, offset: {value: 50, unit: nA}}
        impedance: {value: 111, unit: Ω}
        guaranteed: {value: 188, unit: µA, symmetric: true}
      - id: range_18ua
        range: {value: 18, unit: µA}
        accuracy: {gain_pct: 0.25, offset: {value: 10, unit: nA}, notes: [trim_offset]}
        impedance: {value: 1111, unit: Ω}
        guaranteed: {value: 18.8, unit: µA, symmetric: true}

  - id: current_resolution
    title: Current resolution (typical, not guaranteed)
    columns:
      range: Range
      sps_1m: 1 Msps resolution (typical)
      sps_10k: 10 ksps resolution (typical)
      sps_10: 10 sps resolution (typical)
      unit: Units
    rows:
      - {id: range_10a, range: 10 A, sps_1m: 1000, sps_10k: 100, sps_10: 10, unit: µA}
      - {id: range_180ma, range: 180 mA, sps_1m: 100, sps_10k: 10, sps_10: 1, unit: µA}
      - {id: range_18ma, range: 18 mA, sps_1m: 10, sps_10k: 1, sps_10: 0.1, unit: µA}
      - {id: range_1800ua, range: 1.8 mA, sps_1m: 1000, sps_10k: 100, sps_10: 10, unit: nA}
      - {id: range_180ua, range: 180 µA, sps_1m: 100, sps_10k: 10, sps_10: 1, unit: nA}
      - {id: range_18ua, range: 18 µA, sps_1m: 10, sps_10k: 1, sps_10: 0.1, unit: nA}

  - id: voltage_ranges
    title: Voltage measurement specifications
    columns:
      range: Range
      accuracy: {label: Accuracy, notes: [voltage_accuracy]}
      guaranteed: Guaranteed
    rows:
      - id: range_15v
        range: {value: 15, unit: V}
        accuracy: {gain_pct: 0.1, offset: {value: 500, unit: µV}}
        guaranteed: {value: 15.5, unit: V, symmetric: true}
      - id: range_2v
        range: {value: 2, unit: V}
        accuracy: {gain_pct: 0.1, offset: {value: 200, unit: µV}}
        guaranteed: {value: 2.05, unit: V, symmetric: true}

  - id: voltage_resolution
    title: Voltage resolution (typical, not guaranteed)
    columns:
      range: Range
      sps_1m: 1 Msps resolution (typical)
      sps_10k: 10 ksps resolution (typical)
      sps_10: 10 sps resolution (typical)
      unit: Units
    rows:
      - {id: range_15v, range: 15 V, sps_1m: 500, sps_10k: 50, sps_10: 10, unit: µV}
      - {id: range_2v, range: 2 V, sps_1m: 100, sps_10k: 10, sps_10: 2, unit: µV}

  - id: general
    title: General specifications
    columns: {name: "", condition: Test condition, min: Min, typ: Typical, max: Max, unit: Unit}
    rows:
      - {id: sampling_frequency, name: Sampling frequency, condition: 25 °C, typ: 1000000, unit: sps}
      - {id: sampling_frequency_accuracy, name: Sampling frequency accuracy, condition: 25 °C, min: -5, max: 5, unit: ppm}
      - {id: bandwidth, name: Measurement bandwidth, condition: -3 dB, min: 185, typ: 195, max: 225, unit: kHz}
      - {id: compensated_bandwidth, name: Compensated bandwidth, condition: -3 dB, min: 280, typ: 300, max: 350, unit: kHz}
      - {id: front_panel_insertions, name: Front panel insertions, max: 100}

  - id: parasitic
    title: Parasitic effects specifications
    columns: {name: "", condition: Test condition, min: Min, typ: Typical, max: Max, unit: Unit}
    rows:
      - {id: voltage_leakage_3v3, name: Current leakage (Voltage + to -), condition: "25 °C, ±3.3V", typ: 100, unit: pA}
      - {id: voltage_leakage_5v, name: Current leakage (Voltage + to -), condition: "25 °C, ±5V", typ: 100, unit: pA}
      - {id: voltage_leakage_15v, name: Current leakage (Voltage + to -), condition: "25 °C, ±15V", typ: 100, unit: pA}
      - id: shunt_voltage_max
        name: Shunt resistor voltage, max
        condition: -2 to 2 A, static
        typ: 20
        max: 21
        unit: mV
      - id: burden_voltage
        name: Burden voltage (Current + to -)
        condition: 1 A, banana jacks
        min: 0
        typ: 25
        max: 35
        unit: mV
      - id: burden_voltage_shunt
        name: Burden voltage (Current + to -)
        condition: Shunt resistor, < ±2 A
        max: {value: 20, symmetric: true}
        unit: mV
      - id: shunt_switching_time
        name: Shunt switching time
        condition: Over-range, < 200 ns rise time
        min: 0
        typ: 0.8
        max: 1.2
        unit: µs
      - {id: range_switch_gap, name: Measurement gap following a current range switch, max: 0, unit: µs}
      - id: cmrr
        name: CMRR on voltage input (common mode rejection ratio)
        condition: "25 °C, ±15V"
        typ: -70
        unit: dB

  - id: fuse
    title: Software-controlled fuse specifications
    columns: {name: "", condition: Test condition, min: Min, typ: Typical, max: Max, unit: Unit}
    rows:
      - {id: leakage_3v3, name: Current leakage (Current + to -), condition: "25 °C, 3.3V", typ: {value: 5, symmetric: true}, unit: nA}
      - {id: leakage_5v, name: Current leakage (Current + to -), condition: "25 °C, 5V", typ: {value: 7, symmetric: true}, unit: nA}
      - id: leakage_15v
        name: Current leakage (Current + to -)
        condition: "25 °C, 15V"
        typ: {value: 28, symmetric: true}
        max: {value: 5000, symmetric: true}
        unit: nA
      - {id: engage_5a, name: Fuse engage time, condition: 5 A, typ: 0.293, unit: s}
      - {id: engage_10a, name: Fuse engage time, condition: 10 A, typ: "0.050", unit: s}

  - id: gpio
    title: General purpose inputs and outputs
    columns: {name: "", condition: Test condition, min: Min, typ: Typical, max: Max, unit: Unit}
    rows:
      - {id: vref_internal, name: Internal 3.3V reference, min: 3.135, typ: 3.3, max: 3.465, unit: V}
      - id: vref_external
        name: External reference
        condition: Vref < (VUSB - 0.5 V)
        min: Vref - 0.1
        typ: Vref
        max: Vref + 0.1
        unit: V
      - {id: input_leakage_25c, name: Input leakage per pin, condition: 25 °C, max: {value: 10, symmetric: true}, unit: nA}
      - {id: input_leakage, name: Input leakage per pin, max: {value: 100, symmetric: true}, unit: nA}
      - {id: output_high, name: Output voltage high, condition: -100 µA, min: Vcco - 0.1, unit: V}
      - {id: output_impedance, name: Output impedance, condition: 10 mA, min: 45, typ: 50, max: 80, unit: Ω}
      - {id: gpi_sample_rate, name: GPI sample rate, typ: 1, unit: MSPS}
      - {id: output_current, name: Continuous output current, condition: Per pin, max: {value: 50, symmetric: true}, unit: mA}
      - {id: power_dissipation, name: Total power dissipation, condition: Over output impedance, max: 0.25, unit: W}
